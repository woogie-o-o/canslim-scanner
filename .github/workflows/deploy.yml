name: Deploy to Oracle E2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 168.110.117.10
          username: ubuntu
          key: ${{ secrets.E2_SSH_KEY }}
          script: |
            echo "=== COMPREHENSIVE DIAGNOSTICS ==="
            echo "1. List files in ~/apps:"
            ls -la ~/apps || echo "~/apps not found"

            echo "2. Find all Git repositories on the server:"
            find /home/ubuntu -maxdepth 4 -name ".git" 2>/dev/null || true

            echo "3. Check running Python/Gunicorn/Scanner processes:"
            ps aux | grep -E "python|gunicorn|scanner" | grep -v grep || true

            echo "4. Check systemd service status for scanner:"
            sudo systemctl status scanner --no-pager -l || true

            echo "5. Check other potential systemd services:"
            sudo systemctl list-units --type=service | grep -E "scanner|quant|api|bot" || true
