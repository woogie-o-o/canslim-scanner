name: Deploy to Oracle E2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 168.110.117.10
          username: ubuntu
          key: ${{ secrets.E2_SSH_KEY }}
          script: |
            cd ~/apps/canslim-quant-scanner
            ./deploy.sh
