name: Deploy to Oracle E2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 168.110.117.10
          username: ubuntu
          key: ${{ secrets.E2_SSH_KEY }}
          script: |
            echo "=== DIAGNOSTICS ==="
            echo "1. Current path:" && pwd
            echo "2. Listing current directory:" && ls -la
            echo "3. Listing home directory:" && ls -la ~
            echo "4. Listing /home/ubuntu:" && ls -la /home/ubuntu
            echo "5. Finding deploy.sh on the server:"
            find ~ -name "deploy.sh" 2>/dev/null || true
            find /home/ubuntu -name "deploy.sh" 2>/dev/null || true


