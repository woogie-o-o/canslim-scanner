name: Rollback Oracle Deployment

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "롤백할 git 커밋 SHA (40자 또는 7자 단축)"
        required: true
        type: string
      reason:
        description: "롤백 사유 (장애 ID/요약)"
        required: true
        type: string

concurrency:
  group: deploy-oracle
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and rollback
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 168.110.117.10
          username: ubuntu
          key: ${{ secrets.E2_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            echo "::group::Rollback context"
            echo "Target SHA : ${{ inputs.target_sha }}"
            echo "Reason     : ${{ inputs.reason }}"
            echo "Triggered  : $(date -u +%FT%TZ)"
            echo "::endgroup::"

            REPO_DIR=""
            for dir in /home/ubuntu/canslim-quant-scanner /home/ubuntu/apps/canslim-quant-scanner /home/ubuntu/quant-scanner; do
              if [ -d "$dir/.git" ]; then
                REPO_DIR="$dir"
                break
              fi
            done
            if [ -z "$REPO_DIR" ]; then
              REPO_DIR=$(find /home/ubuntu -maxdepth 4 -name ".git" 2>/dev/null | head -n 1 | sed 's/\/\.git$//')
            fi
            if [ -z "$REPO_DIR" ] || [ ! -d "$REPO_DIR" ]; then
              echo "::error::Could not locate git repository under /home/ubuntu"
              exit 1
            fi

            cd "$REPO_DIR"
            git remote set-url origin https://github.com/woogie-o-o/canslim-scanner.git
            git fetch origin main --prune

            # SHA 검증 — 존재 안 하면 즉시 종료
            if ! git cat-file -e "${{ inputs.target_sha }}^{commit}" 2>/dev/null; then
              echo "::error::Target SHA not found in repo: ${{ inputs.target_sha }}"
              exit 1
            fi

            # 현재 SHA 백업 (이중 롤백 대비)
            PREV_SHA=$(git rev-parse HEAD)
            echo "Previous HEAD: $PREV_SHA"

            git reset --hard "${{ inputs.target_sha }}"

            SVC_NAME=""
            for svc in scanner canslim-quant-scanner canslim quant-scanner webapp app; do
              if systemctl is-active --quiet "$svc" || systemctl is-enabled --quiet "$svc" 2>/dev/null; then
                SVC_NAME="$svc"
                echo "Found active/enabled service: $SVC_NAME"
                break
              fi
            done

            if [ -z "$SVC_NAME" ]; then
              SVC_PATH=$(find /etc/systemd/system/ -maxdepth 2 -name "*.service" -not -name "snap.*" 2>/dev/null | while read svc; do
                if grep -qiE "gunicorn|app|wsgi|scanner" "$svc"; then
                  echo "$svc"
                  break
                fi
              done)
              if [ -n "$SVC_PATH" ]; then
                SVC_NAME=$(basename "$SVC_PATH")
                echo "Found service from file: $SVC_NAME"
              fi
            fi

            if [ -n "$SVC_NAME" ]; then
              sudo systemctl restart "$SVC_NAME"
              sudo systemctl status "$SVC_NAME" --no-pager -l
            else
              echo "WARNING: Could not determine service name, attempting fallback restart..."
              sudo systemctl restart scanner || sudo systemctl restart canslim || echo "No service restarted"
            fi
